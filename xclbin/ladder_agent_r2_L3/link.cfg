# v++ --link config for autosa_mm (agent ladder r2 L3), xilinx_u280_gen3x16_xdma_1_202211_1, 300 MHz default kernel clock.
[connectivity]
nk=autosa_mm:1:autosa_mm_1
# A and C are light (4 MB each, A panel loaded once, C written once): HBM pseudo-channels in SLR0.
sp=autosa_mm_1.A:HBM[0]
sp=autosa_mm_1.C:HBM[1]
# B streams one 512-bit beat per cycle (32 MB in ~1.8 ms = 19.2 GB/s at 300 MHz). One HBM pseudo-channel peaks at
# ~14.4 GB/s; one DDR4-2400 channel peaks at 19.2 GB/s. DDR[1] sits in SLR1, away from the HBM side in SLR0.
sp=autosa_mm_1.B:DDR[1]
# No SLR pinning: the kernel (~88% of the dynamic region's LUTs) must spread across all three SLRs.

[vivado]
# Kernel synthesis: v++ already passes its own synth_design -directive to kernel runs, so a second DIRECTIVE
# fails ("'directive' can only be specified once", attempt 1). Keep v++'s directive; add global retiming
# (FFs are at ~48%, so retiming registers are affordable).
prop=run.__KERNEL__.STEPS.SYNTH_DESIGN.ARGS.GLOBAL_RETIMING=on
# Implementation: four strategies run in parallel; v++ keeps the best result.
impl.strategies=Congestion_SSI_SpreadLogic_high,Performance_HighUtilSLRs,Performance_ExplorePostRoutePhysOpt,Performance_NetDelay_high
impl.jobs=4
synth.jobs=16
