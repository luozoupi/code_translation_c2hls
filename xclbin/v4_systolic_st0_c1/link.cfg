# v++ --link config for autosa_mm (v4 systolic st0_c1, AutoSA 128 PEs, kernel0), xilinx_u280_gen3x16_xdma_1_202211_1, 300 MHz default kernel clock.
[connectivity]
# All three ports on separate HBM pseudo-channels (SLR0); the systolic array streams A and B through
# IO modules, no DDR controller (no extra LUTs). Routability control for the broadcast-congestion diagnosis.
nk=kernel0:1:kernel0_1
sp=kernel0_1.A:HBM[0]
sp=kernel0_1.B:HBM[1]
sp=kernel0_1.C:HBM[2]
# No SLR pinning: let Vivado spread the kernel across SLRs.

[vivado]
# Kernel synthesis: v++ already passes its own synth_design -directive to kernel runs, so a second DIRECTIVE
# fails ("'directive' can only be specified once", attempt 1). Keep v++'s directive; add global retiming
# (FFs are at ~48%, so retiming registers are affordable).
prop=run.__KERNEL__.STEPS.SYNTH_DESIGN.ARGS.GLOBAL_RETIMING=on
# Implementation: four strategies run in parallel; v++ keeps the best result.
impl.strategies=Congestion_SSI_SpreadLogic_high,Performance_HighUtilSLRs,Performance_ExplorePostRoutePhysOpt,Performance_NetDelay_high
impl.jobs=4
synth.jobs=16
